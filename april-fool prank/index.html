<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blue Prom Dress - Shop Now</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: #EAEDED;
}

/* Header */
.header {
  background-color: #131921;
  color: white;
  padding: 12px 20px;
  font-size: 20px;
  font-weight: bold;
}

/* Layout */
.container {
  display: flex;
  gap: 30px;
  padding: 30px;
}

/* Image section */
.thumb-list img {
  width: 60px;
  margin-bottom: 10px;
  border: 1px solid #ccc;
  cursor: pointer;
}

.main-img img {
  width: 350px;
  border: 1px solid #ddd;
  cursor: pointer;
}

/* Details */
.details {
  max-width: 500px;
}

.title {
  font-size: 22px;
  font-weight: bold;
}

.rating {
  color: #f0c14b;
  margin: 8px 0;
}

.price {
  color: #b12704;
  font-size: 24px;
  margin: 10px 0;
}

/* Buy box */
.buy-box {
  border: 1px solid #ddd;
  padding: 20px;
  width: 250px;
  background: white;
}

.btn {
  background: #FFD814;
  padding: 10px;
  text-align: center;
  margin-top: 10px;
  cursor: pointer;
  border-radius: 5px;
}

.btn:hover {
  background: #F7CA00;
}

</style>
</head>

<body>

<div class="header">amazon</div>

<div class="container">

  <!-- Thumbnails -->
  <div class="thumb-list">
    <img src="YYZL717_Blue_3_compact.webp" onclick="changeImg('YYZL717_Blue_3_compact.webp')">
    <img src="YYZL717_Blue_4_compact.webp" onclick="changeImg('YYZL717_Blue_4_compact.webp')">
    <img src="YYZL717Blue_1_-first_compact.webp" onclick="changeImg('YYZL717Blue_1_-first_compact.webp')">
  </div>

  <!-- Main Image -->
  <div class="main-img">
    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank">
      <img id="mainImage" src="OIP.jpg">
    </a>
  </div>

  <!-- Product Details -->
  <div class="details">
    <div class="title">
      Mermaid Blue Prom Dress with Sparkly Finish and Spaghetti Straps
    </div>

    <div class="rating">⭐⭐⭐⭐☆ (1,284 ratings)</div>

    <div class="price">$89.99</div>

    <p>
      Elegant mermaid-style prom dress featuring a shimmering finish,
      perfect for formal events, prom night, and special occasions.
    </p>
  </div>

  <!-- Buy Box -->
  <div class="buy-box">
    <div class="price">$89.99</div>
    <div class="btn" onclick="rickroll()">Add to Cart</div>
    <div class="btn" onclick="rickroll()">Buy Now</div>
  </div>

</div>

<script>
function changeImg(src) {
  document.getElementById("mainImage").src = src;
}

function rickroll() {
  window.open("https://www.youtube.com/watch?v=dQw4w9WgXcQ");
}
</script>

</body>
</html>
